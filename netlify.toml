# Netlify settings
[build]
  publish = "."
  functions = "netlify/functions"

# Styles and scripts: browsers check with Netlify on each visit and get a quick
# "not modified" when nothing changed. A long fixed cache let returning visitors keep an
# old stylesheet after an update (the new neighborhoods menu showed up unstyled).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images keep the same file names when they are replaced, so cache them for a day and let
# browsers refresh in the background for a week instead of re-checking on every visit.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Basic security headers for every page. No Content-Security-Policy on purpose: the site loads
# Google Fonts and the Zillow photo hosts, and a strict policy would break them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Keep the links in the source exactly as written. Netlify's Pretty URLs
# post-processing rewrites href="about.html" to href="/about", which no longer
# matches the canonical tags and the sitemap (both use the .html address) and
# splits the same page across two internal-link targets.
[build.processing.html]
  pretty_urls = false

# Internal notes in the repository root are not part of the website.
[[redirects]]
  from = "/AUDIT.md"
  to = "/404.html"
  status = 404
  force = true
